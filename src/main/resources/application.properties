spring.application.name=assistencia-tecnica
server.port=8080

# Gerenciamento de Sessão - Expiração por inatividade (RN02 / Requisitos)
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Configuração de Banco de Dados MySQL (phpMyAdmin / localhost)
spring.datasource.url=jdbc:mysql://localhost:3306/assistenciadb?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Dialeto Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



# Execução automática de schema.sql e data.sql (RN01)
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Codificação
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
